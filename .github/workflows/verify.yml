name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node verify-kit.mjs   # drift: files match the committed manifest
      - run: npm test              # the claims actually hold (4 harnesses pass)